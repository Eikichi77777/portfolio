<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>レポートマスター詳細</title><link rel="stylesheet" href="intelligence-os-shell.css"></head>
<body>
  <div class="ios-app" data-ios-screen data-ios-title="レポートマスター">
    <div class="report-master-detail">
      <header class="master-heading">
        <div><div class="master-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>戻る</div><h1>レポートマスター詳細</h1><p>レポートマスター設定の詳細情報を表示しています</p></div>
        <div class="master-actions"><button class="ios-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>レポートプレビュー</button><button class="ios-btn primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg>編集</button></div>
      </header>
      <main class="master-sections">
        <section class="master-card"><h2><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>基本情報</h2><div class="master-content"><span class="master-label">レポート名</span><strong class="master-value">店舗売上レポート</strong><span class="master-label" style="margin-top:23px">説明</span><div class="master-description">説明はありません</div></div></section>
        <section class="master-card"><h2><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 12v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7"/></svg></span>使用しているデータセット</h2><div class="master-empty">データセットが設定されていません</div></section>
        <section class="master-card"><h2><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="7" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 3a3 3 0 0 1 0 6M21 20v-2a6 6 0 0 0-4-5.7"/></svg></span>共有設定</h2><div class="master-content"><div class="master-roles"><div class="master-role"><i>デ</i>デモ実施者<button>閲覧</button></div><div class="master-role"><i>管</i>管理者<button>編集</button></div></div></div></section>
        <section class="master-card"><h2><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 13 11 22l-9-9V4h9z"/><circle cx="7" cy="9" r="1"/></svg></span>タグ</h2><div class="master-empty">タグが設定されていません</div></section>
        <section class="master-card"><h2><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>配信スケジュール</h2><div class="master-schedule"><b>毎週月曜日</b><p>※ 配信スケジュールはシステムにより自動設定されています</p></div></section>
      </main>
    </div>
  </div>
  <script src="intelligence-os-shell.js"></script>
</body></html>
