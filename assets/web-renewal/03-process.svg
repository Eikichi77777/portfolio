      <rect x="232" y="224" width="114" height="44" rx="10" fill="#f5f8f7"/><text x="289" y="251" text-anchor="middle" class="small">採用情報</text></g>
    <g transform="translate(32 438)"><rect width="346" height="90" rx="14" fill="#f2f7f6"/><text x="22" y="30" class="micro teal">NAVIGATION PRINCIPLE</text><text x="22" y="59" class="small">課題 → 提供価値 → 実績 → 問い合わせ</text><rect x="22" y="69" width="280" height="6" rx="3" fill="#c9ff69"/></g>
