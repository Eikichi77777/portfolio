<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071b20" flood-opacity=".14"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Arial,sans-serif;fill:#102b32}.micro{font-size:13px;letter-spacing:.12em;font-weight:750}.h1{font-size:44px;font-weight:800;letter-spacing:-.04em}.h2{font-size:23px;font-weight:760}.body{font-size:15px;fill:#62777c}.teal{fill:#28a7b9}.white{fill:#fff}.lime{fill:#c9ff69}.small{font-size:13px;fill:#62777c}</style></defs>
  <rect width="1600" height="900" fill="#eef3f2"/>
  <text x="80" y="86" class="micro teal">INFORMATION DESIGN / PROCESS</text><text x="80" y="142" class="h1">複雑なサービス構造を、迷わない導線へ。</text><text x="80" y="180" class="body">分析・要件からページ構成へ落とし込み、価値が伝わる情報順序を設計しました。</text>
  <g transform="translate(80 232)">
    <g filter="url(#shadow)"><rect width="410" height="560" rx="22" fill="#fff"/></g>
    <text x="32" y="44" class="micro teal">01 / DISCOVERY</text><text x="32" y="84" class="h2">現状と伝達課題を整理</text>
    <g transform="translate(32 120)"><rect width="346" height="92" rx="14" fill="#f2f7f6"/><circle cx="38" cy="46" r="20" fill="#d9efeb"/><path d="M27 47h22M38 36v22" stroke="#28a7b9" stroke-width="3"/><text x="76" y="38" class="micro">SERVICE CHANGE</text><text x="76" y="64" class="small">現在の価値がサイトに反映されていない</text></g>
    <g transform="translate(32 228)"><rect width="346" height="92" rx="14" fill="#f2f7f6"/><circle cx="38" cy="46" r="20" fill="#d9efeb"/><path d="M27 40h22M27 48h18M27 56h14" stroke="#28a7b9" stroke-width="3"/><text x="76" y="38" class="micro">CONTENT GAP</text><text x="76" y="64" class="small">機能説明と利用価値がつながっていない</text></g>
    <g transform="translate(32 336)"><rect width="346" height="92" rx="14" fill="#f2f7f6"/><circle cx="38" cy="46" r="20" fill="#d9efeb"/><path d="M27 56l10-20 8 12 7-8" fill="none" stroke="#28a7b9" stroke-width="3"/><text x="76" y="38" class="micro">CONVERSION</text><text x="76" y="64" class="small">問い合わせまでの次の行動が不明瞭</text></g>
    <rect x="32" y="466" width="346" height="62" rx="14" fill="#0e3b43"/><text x="56" y="493" class="micro lime">OUTPUT</text><text x="56" y="517" class="small white">伝える対象・優先順位・行動を定義</text>
  </g>
  <path d="M510 510h74" stroke="#28a7b9" stroke-width="3"/><path d="M568 498l16 12-16 12" fill="none" stroke="#28a7b9" stroke-width="3"/>
